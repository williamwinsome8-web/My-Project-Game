<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Simon</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>

<body>
  <h1 id="level-title">Press A Key to Start</h1>
  <div class="container">
    <div id="game-board">
      <div class="row">
        <button type="button" id="green" class="btn green" aria-label="Green"></button>
        <button type="button" id="red" class="btn red" aria-label="Red"></button>
      </div>

      <div class="row">
        <button type="button" id="yellow" class="btn yellow" aria-label="Yellow"></button>
        <button type="button" id="blue" class="btn blue" aria-label="Blue"></button>
      </div>
    </div>

    <div id="game-over-controls" aria-live="polite" hidden>
      <p id="game-over-message">Wrong move! Would you like to continue?</p>
      <button type="button" id="continue-button">Continue</button>
      <button type="button" id="exit-button">Leave</button>
    </div>

    <audio id="green-sound" src="sounds/green.mp3" preload="auto"></audio>
    <audio id="red-sound" src="sounds/red.mp3" preload="auto"></audio>
    <audio id="yellow-sound" src="sounds/yellow.mp3" preload="auto"></audio>
    <audio id="blue-sound" src="sounds/blue.mp3" preload="auto"></audio>
    <audio id="wrong-sound" src="sounds/wrong.mp3" preload="auto"></audio>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="game.js" charset="utf-8"></script>

</body>

</html>
